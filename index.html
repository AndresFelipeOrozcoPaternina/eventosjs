<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ejercicio</title>
  <script src="js/app.js" defer></script>
</head>
<body>
  <h1>Ejercicios eventos js</h1>

  <h2>Ejercicio 1</h2>
  <p>1. Saludo personalizado</p>
  <label for="nombre">Ingrese su nombre:</label>
  <input type="text" id="nombre" name="nombre" placeholder="Ingrese su nombre: ">
  <button id="saludar" type="button">Saludar</button>
  <p id="mensaje"></p>

  <h2>Ejercicio 2</h2>
  <p>2. Contador de clics</p>
  <button id="contador" type="button">Haz clic aquí</button>
  <button id="reiniciarcontador" type="button">Reiniciar contador</button>
  <p id="contador-mensaje"></p>

  <h2>Ejercicio 3</h2>
  <p>Escribir a tiempo real </p>
  <label for="textomismo">Igresa el texto:</label>
  <textarea id="textomismo" name="textomismo" placeholder="Ingrese su texto: "></textarea>
  <p id="textomismo-mensaje"></p>

  <h2>Ejercicio 4</h2>
  <p>4. Cambiar color de fondo de la etiqueta</p>

  <fieldset>
    <legend>Opcion del fondo </legend>

    <input type="radio" id="azul" name="color" value="azul" required>
    <label for="azul">Azul</label>
    <br>

    <input type="radio" id="verde" name="color" value="verde" required>
    <label for="verde">Verde</label>
    <br>

    <input type="radio" id="amarillo" name="color" value="amarillo" required>
    <label for="amarillo">Amarillo</label>
    <br>

    <input type="radio" id="rosa" name="color" value="rosa" required>
    <label for="rosa">Rosa</label>
    <br>
  </fieldset>

  <label for="cambiocolor">Ingrese su nombre:</label>
  <input type="text" id="cambiocolor" name="cambiocolor" placeholder="Ingrese su nombre: ">
</body>
</html>
